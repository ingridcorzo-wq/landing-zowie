<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>¡Gracias por escribirnos! – Centro de Capacitación Docente Zowie</title>
<style>
:root{--g:#1f7a3d;--gd:#14562a;--y:#f5b800;--bg:#fffdf7;--card:#fff;--tx:#2b2f33;--mu:#5d6670;--bd:#e8e4d6}
@media (prefers-color-scheme:dark){:root{--bg:#13180f;--card:#1c2318;--tx:#eef0ea;--mu:#b4bcae;--bd:#2f3a29;--g:#3aa05b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
.box{max-width:560px;background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--g);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.ic{font-size:3rem;line-height:1}
h1{color:var(--g);font-size:1.8rem;margin:.6rem 0}
p{color:var(--mu);margin:0 0 1rem}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--g)}
.b-g{background:var(--g);color:#fff}.b-o{color:var(--g)}
.btn:focus-visible{outline:3px solid var(--y);outline-offset:3px}
</style>
</head>
<body>
<main class="box">
 <div class="ic">✅</div>
 <h1>¡Gracias por escribirnos!</h1>
 <p>Recibimos tu mensaje. El equipo del Centro de Capacitación Docente Zowie te responderá a la brevedad.</p>
 <p>Te enviamos una copia de confirmación a tu correo. Si no la ves, revisa la carpeta de spam o promociones.</p>
 <div class="cta">
  <a class="btn b-g" href="./">Volver al inicio</a>
  <a class="btn b-o" href="https://wa.me/584248578336?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20el%20Curso%20de%20Componente%20Docente." target="_blank" rel="noopener">Escribir por WhatsApp</a>
 </div>
</main>
</body>
</html>
